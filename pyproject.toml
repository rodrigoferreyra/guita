[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guita"
version = "0.1.0"
description = "Local-first CLI for manually tracking personal savings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
guita = "guita.cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guita*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"